# ============================================================
#  Bill Splitter ZAR – nginx config
#  Sits behind Cloudflare (orange-cloud proxy).
#  Cloudflare terminates TLS; nginx receives plain HTTP on 80.
#  Real visitor IP is in CF-Connecting-IP / X-Forwarded-For.
# ============================================================

# Trust Cloudflare's IP ranges so $remote_addr is correctly restored.
# Full list: https://www.cloudflare.com/ips/
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header   CF-Connecting-IP;

server {
    listen 80;
    server_name _;

    # ── Frontend (PWA) ─────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # SPA: unknown routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (content-addressed)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Service worker must not be cached so updates propagate
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ── n8n Webhook Proxy ──────────────────────────────────────
    # Browsers call /webhook/... → nginx forwards to n8n container.
    # This avoids CORS issues and keeps n8n off the public internet.
    location /webhook/ {
        proxy_pass            http://n8n:5678/webhook/;
        proxy_http_version    1.1;
        proxy_set_header      Host               $host;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        # Tell n8n the original scheme (Cloudflare always sends https)
        proxy_set_header      X-Forwarded-Proto  $http_x_forwarded_proto;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        # Allow large receipt images (up to 20 MB)
        client_max_body_size  20m;
    }

    # ── Security Headers ───────────────────────────────────────
    add_header X-Frame-Options        DENY                              always;
    add_header X-Content-Type-Options nosniff                           always;
    add_header Referrer-Policy        strict-origin-when-cross-origin   always;
    # Allow camera for receipt capture; restrict other powerful features
    add_header Permissions-Policy     "camera=self, microphone=(), geolocation=()" always;

    # ── Logging ────────────────────────────────────────────────
    access_log /var/log/nginx/bill-splitter-access.log;
    error_log  /var/log/nginx/bill-splitter-error.log;
}
